[project]
name = "tailr"
version = "0.1.0"
description = "A local-first CV tailoring application."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
    "pytest>=8.0",
    "pytest-django>=4.8",
    "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
