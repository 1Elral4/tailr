{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>tailr</title>
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <script src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js" defer></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <header class="border-b border-slate-200 bg-white">
      <nav class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4" aria-label="Primary navigation">
        <a class="text-xl font-bold tracking-tight" href="{% url 'home' %}">tailr</a>
        <div class="flex gap-4">
          <a class="{% if request.path|slice:':11' == '/data-bank/' %}font-semibold{% endif %}" href="/data-bank/">Data Bank</a>
          <a class="{% if request.path|slice:':14' == '/applications/' %}font-semibold{% endif %}" href="/applications/">Applications</a>
        </div>
      </nav>
    </header>
    <div class="mx-auto max-w-6xl px-4" aria-live="polite">
      {% if messages %}
        {% for message in messages %}
          <div class="my-4 rounded border p-3 {{ message.tags|default:'info' }}" role="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
    </div>
    <main class="mx-auto max-w-6xl px-4 py-8">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
